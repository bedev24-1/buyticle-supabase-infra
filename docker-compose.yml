version: '3.8'

# Tous les secrets viennent des variables d'environnement définies dans Coolify
# (POSTGRES_PASSWORD, SUPABASE_ADMIN_PASSWORD, AUTHENTICATOR_PASSWORD,
#  JWT_SECRET, ANON_KEY, SERVICE_ROLE_KEY). Rien de secret dans ce dépôt.
#
# Aucun port n'est publié sur internet : Docker contourne UFW, donc un port
# publié ici serait ouvert au monde entier. rest et storage sont servis par
# Coolify (Traefik) via leurs domaines. Studio n'écoute que sur 127.0.0.1 :
# y accéder par tunnel SSH (ssh -L 3011:127.0.0.1:3011 root@IP_DU_VPS).

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SUPABASE_ADMIN_PASSWORD: ${SUPABASE_ADMIN_PASSWORD:?}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?}
    volumes:
      - supabase_db_final:/var/lib/postgresql/data
    # Joignable par les autres applications Coolify sous le nom "supabase-db"
    # (réseau Docker interne "coolify" : aucun port ouvert sur internet).
    networks:
      default:
      coolify:
        aliases:
          - supabase-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    build:
      context: .
      dockerfile: Dockerfile.postgrest
    container_name: supabase-rest
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?}@db:5432/postgres?sslmode=disable&connect_timeout=10
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
    depends_on:
      db:
        condition: service_healthy

  meta:
    build:
      context: .
      dockerfile: Dockerfile.meta
    container_name: supabase-meta
    environment:
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
    depends_on:
      db:
        condition: service_healthy

  storage:
    build:
      context: .
      dockerfile: Dockerfile.storage
    container_name: supabase-storage
    environment:
      ANON_KEY: ${ANON_KEY:?}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?}
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      DATABASE_URL: postgresql://supabase_admin:${SUPABASE_ADMIN_PASSWORD:?}@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - supabase_storage:/var/lib/storage

  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    container_name: supabase-imgproxy
    environment:
      IMGPROXY_BIND: :8080
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
    volumes:
      - supabase_storage:/var/lib/storage:ro

  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    container_name: supabase-studio
    environment:
      SUPABASE_ANON_KEY: ${ANON_KEY:?}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?}
      SUPABASE_INTERNAL_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?}
      NEXT_PUBLIC_STORAGE_KEY: ${SERVICE_ROLE_KEY:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    depends_on:
      - rest
      - meta
      - storage
    ports:
      - "127.0.0.1:3011:3000"

networks:
  coolify:
    external: true

volumes:
  supabase_db_final:
  supabase_storage:
